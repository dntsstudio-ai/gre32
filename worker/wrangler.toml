name = "vat-payments"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Обычные переменные (не секреты) — можно смотреть в этом файле.
[vars]
FIREBASE_PROJECT_ID = "voice-acting-team"
ROBOKASSA_MERCHANT_LOGIN = "ЗАПОЛНИТЬ_ПОСЛЕ_ПОДКЛЮЧЕНИЯ"
ROBOKASSA_TEST_MODE = "1"
# Из config/config.js сайта (EMAILJS_CONFIG) — публичный ключ, не секрет.
EMAILJS_PUBLIC_KEY = "FExFPIAtSKcFcS2yy"
EMAILJS_SERVICE_ID = "service_sws"
# Новый шаблон в EmailJS для письма с промокодом (см. worker/README.md).
EMAILJS_TEMPLATE_STARSCODE = "template_starscode"

# Секреты — сюда НЕ вписывать значения. Задаются командой:
#   wrangler secret put ИМЯ
# (см. worker/README.md)
#   ROBOKASSA_PASSWORD1
#   ROBOKASSA_PASSWORD2
#   FIREBASE_CLIENT_EMAIL
#   FIREBASE_PRIVATE_KEY
#   EMAILJS_PRIVATE_KEY
